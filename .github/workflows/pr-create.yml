name: pr-create (ai-coder reusable)

on:
  workflow_call:
    inputs:
      repo:
        type: string
        required: true
        description: Target repository (owner/name)
      issue_number:
        type: string
        required: true
        description: Issue this PR implements
    secrets:
      PAT_TOKEN:
        required: true
        description: Fine-grained PAT with Contents+Issues read/write on the target repo

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest
    if: github.repository != 'gardusig/ai-coder'
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo }}
          token: ${{ secrets.PAT_TOKEN }}
          ref: ${{ github.head_ref }}

      # ai marker: pr-create-gh
      # TODO(ai): branch ai/<issue>-<slug>, implement issue #N + tests, open a
      # draft PR linking the issue, comment the PR link on the issue.
      - name: AI stub — create PR
        run: |
          echo "AI_STAGE=pr-create"
          echo "REPO=${{ inputs.repo }}"
          echo "ISSUE=${{ inputs.issue_number }}"
