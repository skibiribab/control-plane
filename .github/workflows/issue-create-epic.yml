name: issue-create-epic (ai-coder reusable)

on:
  workflow_call:
    inputs:
      repo:
        type: string
        required: true
        description: Target repository (owner/name)
      epic_title:
        type: string
        required: true
        description: Title of the parent issue
      epic_body:
        type: string
        required: false
        default: ''
        description: Goal / context for the epic
    secrets:
      PAT_TOKEN:
        required: true
        description: Fine-grained PAT with Contents+Issues read/write on the target repo

permissions:
  contents: read
  issues: write

jobs:
  create-epic:
    runs-on: ubuntu-latest
    if: github.repository != 'gardusig/ai-coder'
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo }}
          token: ${{ secrets.PAT_TOKEN }}

      # ai marker: issue-create-epic-gh
      # TODO(ai): decompose epic_title/epic_body into child issues following the
      # shared template (Context / Goal / Tasks / Acceptance criteria / Depends on),
      # create the parent issue listing children + status table, back-link both ways.
      - name: AI stub — create epic
        run: |
          echo "AI_STAGE=issue-create-epic"
          echo "REPO=${{ inputs.repo }}"
          echo "EPIC_TITLE=${{ inputs.epic_title }}"
