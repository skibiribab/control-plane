name: release-router (control-plane reusable)

# Reusable release for thin repos: resolve latest published cli version →
# validate (`cli check` in the repo's primary image) → timestamp tag → push →
# GitHub release with generated notes. Repos call this from their own
# release.yml instead of hand-rolling the same steps.

on:
  workflow_call:
    inputs:
      repository:
        type: string
        required: true
      ref:
        type: string
        required: true
        default: main
      image:
        type: string
        required: false
        default: node
        description: Primary validation image variant (node for markdown/JS repos).

permissions:
  contents: write

jobs:
  release:
    if: github.repository != 'skibiribab/control-plane'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Set up BuildKit (dockerfile lint)
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - id: cli
        name: Resolve latest published cli version
        run: |
          v="$(curl -fsSL "https://hub.docker.com/v2/repositories/skibiribab/cli/tags?page_size=100" \
            | grep -oE '"name":"[0-9]+\.[0-9]+\.[0-9]+-(orphanage|node|python|rust|cpp|go|java|media|ai)"' \
            | sed -E 's/"name":"([^"]+)"/\1/' \
            | sed -E 's/-[^-]+$//' \
            | sort -V | tail -n1 || true)"
          echo "version=${v}" >> "$GITHUB_OUTPUT"
          echo "image=${{ inputs.image }}" >> "$GITHUB_OUTPUT"

      - name: Validate (cli check)
        env:
          CLI_VERSION: ${{ steps.cli.outputs.version }}
        run: |
          if [[ -z "$CLI_VERSION" ]]; then
            echo "could not resolve published cli version" >&2
            exit 1
          fi
          docker run --rm --entrypoint bash \
            -v "$PWD:/repo" -w /repo \
            -v /var/run/docker.sock:/var/run/docker.sock \
            "skibiribab/cli:${CLI_VERSION}-${{ inputs.image }}" \
            -ec "cli check ."

      - name: Publish tag
        id: tag
        run: |
          TAG="$(date -u +%Y-%m-%dT%H-%M-%SZ)"
          git tag "$TAG"
          git push origin "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
