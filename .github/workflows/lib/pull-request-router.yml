name: pull-request-router (control-plane reusable)

# Dispatcher router for thin repos. A target repo calls this reusable from its
# own PR workflow; it checks out the PR head, runs the pipeline defined in the
# repo's `.github/pull-request.yaml` (fallback `.github/repo-review.yaml`)
# against the repo's own Dockerfile targets, and posts the results to the PR.

on:
  workflow_call:
    inputs:
      repo_slug:
        type: string
        required: true
      repository:
        type: string
        required: true
      ref:
        type: string
        required: true
      sha:
        type: string
        required: true
      pr_number:
        type: string
        required: true
    secrets:
      CENTRAL_PIPELINE_PAT:
        required: true

permissions:
  contents: read

jobs:
  pipeline:
    if: github.repository != 'skibiribab/control-plane'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.sha }}

      - id: spec
        name: Resolve PR pipeline spec
        run: |
          spec=".github/pull-request.yaml"
          if [[ ! -f "$spec" ]]; then
            spec=".github/repo-review.yaml"
          fi
          if [[ ! -f "$spec" ]]; then
            echo "no PR pipeline spec found" >&2
            exit 1
          fi
          echo "spec=$spec" >> "$GITHUB_OUTPUT"

      - name: Run pipeline targets
        env:
          SPEC: ${{ steps.spec.outputs.spec }}
        run: |
          set -uo pipefail
          mapfile -t ids < <(grep -E '^\s*- id:' "$SPEC" | sed -E 's/.*- id:[[:space:]]*//' | tr -d '"')
          mapfile -t names < <(grep -E '^\s*name:' "$SPEC" | sed -E 's/.*name:[[:space:]]*//' | tr -d '"')
          mapfile -t targets < <(grep -E '^\s*target:' "$SPEC" | sed -E 's/.*target:[[:space:]]*//' | tr -d '"')
          : > /tmp/summary.txt
          dockerfile_arg=""
          if [[ -f docker/Dockerfile ]]; then
            dockerfile_arg="-f docker/Dockerfile"
          elif [[ -f Dockerfile ]]; then
            dockerfile_arg="-f Dockerfile"
          fi
          for i in "${!ids[@]}"; do
            target="${targets[$i]}"
            label="${ids[$i]}"
            if [[ -n "${names[$i]:-}" ]]; then label="$label (${names[$i]})"; fi
            echo "=== $label target=$target"
            if docker build $dockerfile_arg --target "$target" -t "pr-${target}" . >/tmp/build.log 2>&1; then
              if docker run --rm "pr-${target}" >/tmp/run.log 2>&1; then
                echo "PASS $label" | tee -a /tmp/summary.txt
              else
                echo "FAIL $label" | tee -a /tmp/summary.txt
                tail -30 /tmp/run.log >&2 || true
              fi
            else
              echo "FAIL $label" | tee -a /tmp/summary.txt
              tail -30 /tmp/build.log >&2 || true
            fi
          done

      - name: Post result to PR
        env:
          GH_TOKEN: ${{ secrets.CENTRAL_PIPELINE_PAT }}
        run: |
          body="Pipeline results ($(date -u +%Y-%m-%dT%H-%M-%SZ)):
$(sed 's/^/- /' /tmp/summary.txt)"
          gh pr comment "${{ inputs.pr_number }}" --repo "${{ inputs.repository }}" --body "$body"
