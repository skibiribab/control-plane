name: issue-pick-task (ai-coder reusable)

on:
  workflow_call:
    inputs:
      repo:
        type: string
        required: true
        description: Target repository (owner/name)
    secrets:
      PAT_TOKEN:
        required: true
        description: Fine-grained PAT with Contents+Issues read/write on the target repo

permissions:
  contents: read
  issues: write

jobs:
  pick-task:
    runs-on: ubuntu-latest
    if: github.repository != 'skibiribab/control-plane'
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo }}
          token: ${{ secrets.GH_TOKEN_REPO_WRITE }}

      # ai marker: issue-pick-task-gh
      # TODO(ai): score open issues (has acceptance criteria, no PR, not blocked,
      # not ai/parked). Pick the least-ambiguous one deterministically, label it
      # ai/in-progress, post a plan comment. Output the issue_number for pr-create.
      - name: AI stub — pick task
        run: |
          echo "AI_STAGE=issue-pick-task"
          echo "REPO=${{ inputs.repo }}"
