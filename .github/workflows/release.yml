name: Publish

# Tag-driven publish: git tag X.Y.Z → build + push the 7 language images to
# Docker Hub → GitHub release. Tags are bare x.y.z (no v prefix).

on:
  workflow_dispatch:
  push:
    tags:
      - "[0-9]*"
    branches:
      - main

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  RUNTIME_IMAGE: skibiribab/pkg-manager

jobs:
  auto-tag:
    name: Auto-version + tag
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - id: guard
        name: Guard (skip release commits / already tagged)
        run: |
          set -euo pipefail
          msg="$(git log -1 --pretty=%s)"
          if [[ "$msg" == "chore(release):"* ]]; then
            echo "HEAD is a release commit — skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git tag --points-at HEAD | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "HEAD already tagged — skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
      - id: tag
        name: Tag merged VERSION
        if: steps.guard.outputs.skip != 'true'
        env:
          PAT_TOKEN: ${{ secrets.GH_TOKEN_REPO_WRITE }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must be bare semver x.y.z, got: ${version}" >&2
            exit 1
          fi
          git tag "${version}"
          if [[ -n "$PAT_TOKEN" ]]; then
            git remote set-url origin "https://x-access-token:${PAT_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push origin "${version}"
          else
            git push origin "${version}"
            echo "::warning::PAT_TOKEN secret is not set — tag pushed with GITHUB_TOKEN, publish will not auto-trigger"
          fi

  publish:
    name: Publish images
    needs: auto-tag
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: [node, python, rust, cpp, go, java, media]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: docker build — ${{ matrix.variant }}
        run: |
          docker build -f docker/${{ matrix.variant }}.dockerfile \
            -t "${RUNTIME_IMAGE}:${GITHUB_REF_NAME}-${{ matrix.variant }}" .
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: docker push — ${{ matrix.variant }}
        run: |
          docker push "${RUNTIME_IMAGE}:${GITHUB_REF_NAME}-${{ matrix.variant }}"

  release:
    name: GitHub release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
