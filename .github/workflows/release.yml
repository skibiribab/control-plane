name: Publish

# Tag-driven publish: git tag X.Y.Z → docker build → docker push → smoke → GitHub release.
# Docker-only: PyPI publishing is dropped; the CLI ships in the runtime images.

on:
  push:
    tags:
      - "*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  PR_DOCKERFILE: src/docker/pull-request.dockerfile
  RUNTIME_IMAGE: binarylifter/gardusig-cli

jobs:
  resolve:
    name: Resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 6
    outputs:
      git_tag: ${{ steps.meta.outputs.git_tag }}
      version: ${{ steps.meta.outputs.version }}
      docker_tag: ${{ steps.meta.outputs.docker_tag }}
    steps:
      - id: checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
        timeout-minutes: 3
      - id: meta
        name: docker — resolve
        timeout-minutes: 3
        run: |
          docker build -f "${PR_DOCKERFILE}" --target resolve-release -t ci-release-resolve .
          PREV_VERSION="$(git tag --sort=-v:refname 2>/dev/null \
            | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+' \
            | grep -vx "${GITHUB_REF_NAME}" \
            | head -n1 \
            | sed 's/^v//' \
            || true)"
          docker run --rm \
            -e GITHUB_OUTPUT \
            -e GITHUB_REF_NAME="${GITHUB_REF_NAME}" \
            -e PREV_VERSION="${PREV_VERSION}" \
            -v "${GITHUB_OUTPUT}:${GITHUB_OUTPUT}" \
            ci-release-resolve
      - id: cleanup
        name: docker — cleanup
        timeout-minutes: 3
        run: docker image prune -af >/dev/null && docker builder prune -af >/dev/null

  publish-docker:
    name: Publish to Docker
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - id: checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        timeout-minutes: 3
      - id: buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
        timeout-minutes: 3
      - id: runtime
        name: Publish to Docker — build runtime variants
        timeout-minutes: 40
        env:
          CLI_VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          for variant in base rust node python cpp go media java; do
            file="src/docker/${variant}.dockerfile"
            tag="${RUNTIME_IMAGE}:${CLI_VERSION}-${variant}"
            if [[ "${variant}" == "base" ]]; then
              tag="${RUNTIME_IMAGE}:${CLI_VERSION}"
            fi
            docker build -f "${file}" -t "${tag}" .
          done
          docker tag "${RUNTIME_IMAGE}:${CLI_VERSION}" "${RUNTIME_IMAGE}:base-${CLI_VERSION}"
          docker run --rm "${RUNTIME_IMAGE}:${CLI_VERSION}" --version | grep -Fxq "${CLI_VERSION}"
      - id: ci-tools
        name: docker build — ci-tools
        timeout-minutes: 3
        run: |
          docker build -f "${PR_DOCKERFILE}" --target ci-push -t ci-release-push .
          docker build -f "${PR_DOCKERFILE}" --target ci-smoke -t ci-release-smoke .
      - id: docker-login
        name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        timeout-minutes: 3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: publish-docker
        name: Publish to Docker
        timeout-minutes: 15
        env:
          CLI_VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${HOME}/.docker/config.json:/root/.docker/config.json:ro" \
            -e CLI_VERSION="${CLI_VERSION}" \
            -e RUNTIME_IMAGE="${RUNTIME_IMAGE}" \
            ci-release-push
      - id: runtime-smoke
        name: Publish to Docker — smoke
        timeout-minutes: 30
        env:
          CLI_VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${HOME}/.docker/config.json:/root/.docker/config.json:ro" \
            -e CLI_VERSION="${CLI_VERSION}" \
            -e RUNTIME_IMAGE="${RUNTIME_IMAGE}" \
            ci-release-smoke
      - id: cleanup
        name: docker — cleanup image + cache
        timeout-minutes: 6
        run: |
          docker image prune -af >/dev/null
          docker builder prune -af >/dev/null

  publish-github:
    name: Publish to GitHub
    needs: [resolve, publish-docker]
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - id: checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
        timeout-minutes: 3
      - id: ci-tools
        name: docker build — ci-github-release
        timeout-minutes: 3
        run: docker build -f "${PR_DOCKERFILE}" --target ci-github-release -t ci-github-release .
      - id: publish-github
        name: Publish to GitHub
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.git_tag }}
          CLI_VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          docker run --rm \
            -e GH_TOKEN="${GH_TOKEN}" \
            -e GITHUB_REPOSITORY="${GITHUB_REPOSITORY}" \
            -e RELEASE_TAG="${RELEASE_TAG}" \
            -e CLI_VERSION="${CLI_VERSION}" \
            -e RUNTIME_IMAGE="${RUNTIME_IMAGE}" \
            ci-github-release
      - id: cleanup
        name: docker — cleanup
        timeout-minutes: 3
        run: docker image prune -af >/dev/null && docker builder prune -af >/dev/null
