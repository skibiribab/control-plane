name: issue-find-gaps (ai-coder reusable)

on:
  workflow_call:
    inputs:
      repo:
        type: string
        required: true
        description: Target repository (owner/name) to analyze
      scope:
        type: string
        required: false
        default: ''
        description: Optional comma-separated paths to limit the scan
    secrets:
      PAT_TOKEN:
        required: true
        description: Fine-grained PAT with Contents+Issues read/write on the target repo

permissions:
  contents: read
  issues: write

jobs:
  find-gaps:
    runs-on: ubuntu-latest
    if: github.repository != 'skibiribab/control-plane'
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo }}
          token: ${{ secrets.PAT_TOKEN }}

      # ai marker: issue-find-gaps-gh
      # TODO(ai): compare repo state against open issues; open gap issues
      # (label ai/gap) for weaknesses that are not covered by an existing issue.
      - name: AI stub — find gaps
        run: |
          echo "AI_STAGE=issue-find-gaps"
          echo "REPO=${{ inputs.repo }}"
          echo "SCOPE=${{ inputs.scope }}"
